# Redraws koi/koi.gif every night from this account's public activity.
#
# Hardened setup: the koi is built from the reviewed source vendored in
# koi-src/ (upstream yalongwastaken/git-koi at commit 7305e9b, v1.0.2), not
# from a downloaded binary or a third-party Action. The only outside action is
# actions/checkout, pinned to a full commit SHA. The token is the built-in
# one: scoped to this repository and expiring when the job ends.
name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml
      - koi-src/**

permissions:
  contents: read

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed only to push the redrawn koi.gif back to this repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        # 1.88.0 is the crate's minimum supported version, which upstream CI tests.
        # A fixed toolchain keeps builds reproducible.
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build git-koi from the vendored source
        # --locked: use exactly the dependency versions and checksums in Cargo.lock.
        run: cargo +1.88.0 build --release --locked --manifest-path koi-src/Cargo.toml

      - name: Collect public activity
        env:
          GH_TOKEN: ${{ github.token }}
          KOI_LOGIN: ${{ github.repository_owner }}
        run: koi-src/target/release/git-koi collect "$KOI_LOGIN" --output "$RUNNER_TEMP/koi-snapshot.json"

      - name: Render the koi
        env:
          # One of white, black, asagi, tea, gold, platinum.
          KOI_BODY: white
        run: koi-src/target/release/git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir koi --body "$KOI_BODY"

      - name: Commit the koi if it changed
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
